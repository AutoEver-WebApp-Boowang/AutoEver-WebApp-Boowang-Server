spring:
  application:
    name: boowang

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/boowang_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  security:
    oauth2:
      client:
        registration:
          kakao:
            # .env에 작성한 카카오 앱 정보
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}

            # 비밀값을 토큰 요청 본문에 전달한다.
            client-authentication-method: client_secret_post

            # 인가 코드로 카카오 토큰을 요청한다.
            authorization-grant-type: authorization_code

            # 로그인 결과를 받을 백엔드 주소
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

            # 콘솔에서 켜둔 OpenID Connect를 사용한다.
            scope:
              - openid
              - profile_nickname
            client-name: Kakao

          hyundai:
            # .env에 작성한 현대자동차 앱 정보
            client-id: ${HYUNDAI_CLIENT_ID}
            client-secret: ${HYUNDAI_CLIENT_SECRET}

            # 현대자동차는 Client ID와 Secret을 Basic 인증으로 전달한다.
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code

            # registrationId가 hyundai로 바뀌어 콜백 주소가 완성된다.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Hyundai

        provider:
          kakao:
            # 카카오의 인증·토큰·사용자 정보 API 설정을 조회한다.
            issuer-uri: https://kauth.kakao.com

          hyundai:
            # 현대자동차 로그인, 토큰 발급, 사용자 정보 조회 주소
            authorization-uri: https://prd.kr-ccapi.hyundai.com/api/v1/user/oauth2/authorize
            token-uri: https://prd.kr-ccapi.hyundai.com/api/v1/user/oauth2/token
            user-info-uri: https://prd.kr-ccapi.hyundai.com/api/v1/user/profile

            # 사용자 정보 응답의 id를 현대자동차 사용자의 고유번호로 사용한다.
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
    region: ap-northeast-2
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

app:
  auth:
    # HTTPS를 사용하는 운영 환경을 기본값으로 둔다.
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:None}
